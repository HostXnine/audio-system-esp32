; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
;platform = espressif32 @ ^6.12.0
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.33
board = esp32dev
framework = arduino
board_build.flash_mode = qio
lib_deps = https://github.com/pschatzmann/arduino-audio-tools.git#v1.2.1
           https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.8
           https://github.com/pschatzmann/arduino-libhelix.git#v0.9.2
           arminjo/IRremote@^4.4.1
           madhephaestus/ESP32Servo@3.0.9
           adafruit/Adafruit GFX Library@^1.12.3
           adafruit/Adafruit SH110X@^2.1.14
monitor_speed = 115200
board_build.partitions = huge_app.csv
;monitor_filters = esp32_exception_decoder

;Debugging
;build_flags = -DCORE_DEBUG_LEVEL=5
;-Wno-unused-variable -Wno-unused-but-set-variable -Wno-unused-function -Wno-format-extra-args 

; 2) Switch between built-in tables
; https://github.com/espressif/arduino-esp32/tree/master/tools/partitions
;https://github.com/espressif/esp-idf/tree/master/components/partition_table